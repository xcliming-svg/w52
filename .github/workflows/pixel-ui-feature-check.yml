name: W52 Pixel UI Feature Validation
on:
  push:
    branches:
      - feature/w52-pixel-ui-640x360

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true
      - name: Import W52
        run: godot --headless --path . --import
      - name: W52 pixel UI smoke
        run: godot --headless --path . --script res://tests/w52_ui_smoke.gd
      - name: Web export (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          if [[ ! -s "$template_dir/web_nothreads_release.zip" ]]; then
            curl --fail --location --retry 3 --retry-delay 3 \
              --output /tmp/godot-templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
            unzip -j -o /tmp/godot-templates.tpz \
              "templates/web_nothreads_release.zip" -d "$template_dir"
          fi
          mkdir -p build
          godot --headless --path . --export-release "Web" build/index.html
          test -s build/index.html
          test -s build/index.wasm
          test -s build/index.pck
