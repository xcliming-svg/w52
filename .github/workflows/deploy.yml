name: Godot Web - Stable and Devel

on:
  push:
    branches: [main, devel]

permissions:
  contents: read

concurrency:
  group: w52-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout development devel
        uses: actions/checkout@v4
        with:
          ref: devel
          path: preview

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true

      - name: Ensure Web export templates
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          if [[ ! -s "$template_dir/web_nothreads_release.zip" ]]; then
            curl --fail --location --retry 3 --retry-delay 3 \
              --output /tmp/godot-templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
            unzip -j -o /tmp/godot-templates.tpz \
              "templates/web_nothreads_release.zip" -d "$template_dir"
          fi
          test -s "$template_dir/web_nothreads_release.zip"

      - name: Verify Godot installation
        run: godot --version

      - name: Import and smoke-test stable
        run: |
          godot --headless --path stable --import
          godot --headless --path stable --quit-after 2

      - name: Import and smoke-test development
        run: |
          godot --headless --path preview --import
          godot --headless --path preview --quit-after 2

      - name: Headless smoke-test stable W52 UI
        run: |
          if [[ -f stable/tests/w52_ui_smoke.gd ]]; then
            godot --headless --path stable --script res://tests/w52_ui_smoke.gd
          fi

      - name: Headless smoke-test development W52 UI
        run: |
          if [[ -f preview/tests/w52_ui_smoke.gd ]]; then
            godot --headless --path preview --script res://tests/w52_ui_smoke.gd
          fi

      - name: Headless smoke-test development W52 story
        run: |
          if [[ -f preview/tests/w52_story_smoke.gd ]]; then
            godot --headless --path preview --script res://tests/w52_story_smoke.gd
          fi

      - name: Export stable and development web builds
        run: |
          mkdir -p site/devel
          godot --headless --path stable --export-release "Web" "$GITHUB_WORKSPACE/site/index.html"
          godot --headless --path preview --export-release "Web" "$GITHUB_WORKSPACE/site/devel/index.html"

      - name: Install licensed Korean font for independent tree preview
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f preview/tree/src/project.godot ]]; then
            mkdir -p preview/tree/src/assets
            curl --fail --location --retry 3 --retry-delay 2 \
              --output preview/tree/src/assets/NotoSansKR-Regular.ttf \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
            test "$(stat -c%s preview/tree/src/assets/NotoSansKR-Regular.ttf)" -ge 10000000
            test -s preview/tree/src/assets/NotoSansKR-LICENSE.txt
            grep -q "SIL Open Font License" preview/tree/src/assets/NotoSansKR-LICENSE.txt
          fi

      - name: Run burrow game data and implementation checks
        run: |
          if [[ -f preview/tree/src/tests/burrow_contract_check.mjs ]]; then
            node preview/tree/src/tests/burrow_contract_check.mjs
          fi

      - name: Import and export RAIL SURVIVOR development preview
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f preview/tree/src/project.godot ]]; then
            mkdir -p site/tree-devel
            godot --headless --path preview/tree/src --import 2>&1 | tee /tmp/rail-import.log
            godot --headless --path preview/tree/src --quit-after 2 2>&1 | tee /tmp/rail-smoke.log
            godot --headless --path preview/tree/src --export-release "Web" "$GITHUB_WORKSPACE/site/tree-devel/index.html" 2>&1 | tee /tmp/rail-export.log
            if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Compile Error:)' /tmp/rail-{import,smoke,export}.log; then
              echo "::error::RAIL SURVIVOR emitted engine errors"
              exit 1
            fi
          fi

      - name: Verify both web builds
        run: |
          for prefix in site/index site/devel/index; do
            test -s "${prefix}.html"
            test -s "${prefix}.wasm"
            test -s "${prefix}.pck"
          done
          if [[ -f preview/tree/src/project.godot ]]; then
            for ext in html wasm pck; do test -s "site/tree-devel/index.${ext}"; done
          fi
          touch site/.nojekyll

      - name: Upload tested web builds
        uses: actions/upload-artifact@v4
        with:
          name: w52-web
          path: site/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    # The github-pages environment is restricted to main.
    # For devel pushes, the default-branch workflow_run publisher handles Pages.
    if: github.ref == 'refs/heads/main'
    needs: build
    concurrency:
      group: w52-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download tested builds
        uses: actions/download-artifact@v4
        with:
          name: w52-web
          path: site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
